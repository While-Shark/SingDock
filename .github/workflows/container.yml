name: Container
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: smoke (${{ matrix.platform.arch }}, ${{ matrix.network }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        network: [bridge, host]
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for script in docker/*.sh upstream/sing-box-plus.sh tests/smoke.sh; do
            bash -n "$script"
          done
      - name: Test helper syntax
        run: python3 -m py_compile tests/client_config.py
      - name: Compose configuration
        run: docker compose config --quiet
      - name: Build
        run: docker build -t singdock:test .
      - name: Verify native image architecture and core
        env:
          EXPECTED_ARCH: ${{ matrix.platform.arch }}
        run: |
          test "$(docker image inspect -f '{{.Architecture}}' singdock:test)" = "$EXPECTED_ARCH"
          docker run --rm --entrypoint /usr/local/bin/sing-box singdock:test version
      - name: Deployment and ten real protocol handshakes
        run: bash tests/smoke.sh singdock:test ${{ matrix.network }}
  warp-build:
    name: warp-build (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build optional WARP image (runtime remains experimental)
        run: docker build --build-arg INSTALL_WARP=true -t singdock:warp .
      - name: Verify WARP binary on native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.platform.arch }}
        run: |
          test "$(docker image inspect -f '{{.Architecture}}' singdock:warp)" = "$EXPECTED_ARCH"
          docker run --rm --entrypoint /usr/bin/warp-cli singdock:warp --version
